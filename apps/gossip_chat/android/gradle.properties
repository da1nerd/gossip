org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Network and download settings
org.gradle.daemon=true
org.gradle.configureondemand=true
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin compiler settings
kotlin.incremental=true
kotlin.incremental.android=true
kotlin.incremental.java=true

# Reduce network timeouts and configure retries
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=300000
# Enable and tune HTTP retry behavior for flaky networks
# Note: Gradle will ignore unknown properties gracefully.
systemProp.org.gradle.internal.http.retry.maxAttempts=5
systemProp.org.gradle.internal.http.retry.initialBackOff=2000
systemProp.org.gradle.internal.http.retry.maxBackOff=30000
